<title>COLD READ Greybox</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* COLD READ — greybox build.
   Deliberately single-theme: this is a game viewport, an engine debug view.
   Every color is painted explicitly so it holds on any host ground. */
:root{
  --bg:#0A1013;
  --panel:#121C22;
  --panel-2:#19262D;
  --line:#2B3C45;
  --line-2:#3A4E59;
  --ink:#E4EDF0;
  --muted:#7C939E;
  --dim:#576B75;
  --accent:#FF6A2B;      /* INTERCEPT siren */
  --evi:#45D6C6;         /* evidence */
  --warn:#EF4D63;
  --ok:#93D651;
  --gold:#F2C14E;
  --fx-hud:"Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --fx-body:"Barlow", system-ui, -apple-system, sans-serif;
  --fx-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--fx-body); font-size:15px; line-height:1.45;
  overscroll-behavior:none; -webkit-user-select:none; user-select:none;
  -webkit-tap-highlight-color:transparent;
}
#app{height:100%; display:flex; flex-direction:column; background:var(--bg)}

/* ---------- HUD ---------- */
#hud{
  display:flex; align-items:center; gap:10px;
  padding:8px 14px; background:var(--panel); border-bottom:1px solid var(--line);
  font-family:var(--fx-hud); flex:0 0 auto; min-height:46px;
}
#hud .rank{
  font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--accent); font-weight:700; white-space:nowrap;
}
#hud .caseName{
  font-size:17px; font-weight:700; letter-spacing:.02em; color:var(--ink);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1 1 auto;
}
#hud .sceneTag{
  font-family:var(--fx-mono); font-size:10px; color:var(--dim);
  letter-spacing:.08em; text-transform:uppercase; white-space:nowrap;
}
#hud .stamp{
  font-family:var(--fx-mono); font-size:9px; font-weight:700; color:var(--bg);
  background:var(--dim); padding:2px 5px; border-radius:2px; letter-spacing:.1em;
}
#timerWrap{flex:0 0 auto; width:74px; height:5px; background:var(--line); border-radius:3px; overflow:hidden}
#timerBar{height:100%; width:100%; background:var(--accent); transition:background .2s}
#timerWrap[hidden]{display:none!important}

/* ---------- STAGE ---------- */
#stage{position:relative; flex:1 1 auto; min-height:0; background:var(--bg); touch-action:none}
#gc{position:absolute; inset:0; width:100%; height:100%; display:block}

/* ---------- FOOTER ---------- */
#foot{
  flex:0 0 auto; display:flex; align-items:center; gap:12px;
  padding:7px 14px; background:var(--panel); border-top:1px solid var(--line);
  min-height:40px;
}
#hint{
  font-family:var(--fx-mono); font-size:10.5px; color:var(--dim);
  letter-spacing:.05em; flex:1 1 auto;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
#evBag{display:flex; gap:5px; align-items:center; flex:0 0 auto}
.evDot{
  width:9px; height:9px; border-radius:2px; background:var(--line-2);
  transform:rotate(45deg); transition:background .2s, box-shadow .2s;
}
.evDot.on{background:var(--evi); box-shadow:0 0 8px rgba(69,214,198,.7)}

/* ---------- OVERLAYS ---------- */
.ov{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  padding:18px; background:rgba(10,16,19,.9); z-index:5; overflow-y:auto;
}
.ov[hidden]{display:none!important}
.sheet{width:100%; max-width:560px; margin:auto}
.eyebrow{
  font-family:var(--fx-mono); font-size:10px; letter-spacing:.18em;
  text-transform:uppercase; color:var(--accent); margin-bottom:8px;
}
.eyebrow.cool{color:var(--evi)}
h1,h2,h3{font-family:var(--fx-hud); margin:0; text-wrap:balance; letter-spacing:.01em}
h1{font-size:34px; font-weight:700; line-height:1.05}
h2{font-size:25px; font-weight:700; line-height:1.1}
h3{font-size:16px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
p{margin:10px 0; color:#C3D2D8}
.lede{font-size:16.5px; color:var(--ink)}
.small{font-size:13px; color:var(--muted)}
.mono{font-family:var(--fx-mono); font-size:11.5px; color:var(--dim); letter-spacing:.04em}

.btn{
  font-family:var(--fx-hud); font-size:16px; font-weight:600; letter-spacing:.06em;
  text-transform:uppercase; color:var(--bg); background:var(--accent);
  border:0; border-radius:3px; padding:13px 20px; cursor:pointer; width:100%;
  transition:filter .15s, transform .06s;
}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent; color:var(--ink); border:1px solid var(--line-2)}
.btn.ghost:hover{background:var(--panel-2); filter:none}
.btn:focus-visible, .card:focus-visible, .slot:focus-visible, .choiceBtn:focus-visible{
  outline:2px solid var(--evi); outline-offset:2px;
}
.btnRow{display:flex; gap:10px; margin-top:14px}
.btnRow .btn{width:auto; flex:1 1 0}

/* Read scene */
.sentence{
  background:var(--panel); border:1px solid var(--line); border-radius:4px;
  padding:16px; font-size:19px; font-family:var(--fx-hud); font-weight:500;
  line-height:1.9; margin:14px 0;
}
.slot{
  display:inline-block; min-width:118px; padding:3px 10px; margin:0 3px;
  border-bottom:2px solid var(--line-2); color:var(--dim);
  font-family:var(--fx-mono); font-size:12.5px; text-align:center;
  cursor:pointer; border-radius:2px 2px 0 0; vertical-align:baseline;
}
.slot.filled{background:var(--panel-2); color:var(--evi); border-bottom-color:var(--evi)}
.slot.armed{border-bottom-color:var(--accent); background:rgba(255,106,43,.1)}
.cards{display:flex; flex-wrap:wrap; gap:8px; margin-top:6px}
.card{
  background:var(--panel-2); border:1px solid var(--line-2); border-radius:3px;
  padding:9px 12px; cursor:pointer; text-align:left; color:var(--ink);
  font-family:var(--fx-body); font-size:13.5px; flex:0 1 auto; max-width:100%;
  transition:border-color .15s, background .15s;
}
.card:hover{border-color:var(--evi)}
.card.sel{border-color:var(--accent); background:rgba(255,106,43,.14)}
.card.used{opacity:.3; pointer-events:none}
.card .tag{
  display:block; font-family:var(--fx-mono); font-size:9px; letter-spacing:.1em;
  color:var(--dim); text-transform:uppercase; margin-bottom:2px;
}

/* Choice */
.choiceBtn{
  display:block; width:100%; text-align:left; background:var(--panel);
  border:1px solid var(--line-2); border-left:3px solid var(--accent);
  border-radius:3px; padding:15px 16px; margin-bottom:10px; cursor:pointer;
  color:var(--ink); font-family:var(--fx-body); font-size:15.5px;
  transition:background .15s, transform .06s;
}
.choiceBtn:hover{background:var(--panel-2)}
.choiceBtn:active{transform:translateY(1px)}
.choiceBtn .k{
  font-family:var(--fx-mono); font-size:9.5px; color:var(--accent);
  letter-spacing:.14em; display:block; margin-bottom:4px; text-transform:uppercase;
}
#choiceClock{
  height:4px; background:var(--line); border-radius:3px; overflow:hidden; margin-bottom:14px;
}
#choiceClockBar{height:100%; background:var(--warn); width:100%}

/* Debrief */
.stars{display:flex; gap:7px; margin:12px 0 4px}
.star{
  width:26px; height:26px; background:var(--line); clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
}
.star.on{background:var(--gold)}
.kv{
  display:flex; justify-content:space-between; gap:12px; padding:7px 0;
  border-bottom:1px solid var(--line); font-size:13.5px;
}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--muted); font-family:var(--fx-mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase}
.kv .v{color:var(--ink); text-align:right}
.tile .kv .v{text-align:right; max-width:64%}
.kv .v.good{color:var(--ok)} .kv .v.bad{color:var(--warn)} .kv .v.cool{color:var(--evi)}

/* Title / case select */
.caseRow{
  display:flex; align-items:center; gap:13px; width:100%; text-align:left;
  background:var(--panel); border:1px solid var(--line); border-radius:4px;
  padding:13px 15px; margin-bottom:9px; cursor:pointer; color:var(--ink);
  transition:border-color .15s, background .15s;
}
.caseRow:hover{border-color:var(--accent); background:var(--panel-2)}
.caseRow .num{
  font-family:var(--fx-mono); font-size:11px; color:var(--accent); font-weight:700;
  flex:0 0 auto; width:22px;
}
.caseRow .nm{flex:1 1 auto; font-family:var(--fx-hud); font-size:17px; font-weight:600}
.caseRow .meta{font-family:var(--fx-mono); font-size:10px; color:var(--dim); text-align:right; flex:0 0 auto}
.caseRow[disabled]{opacity:.42; cursor:not-allowed}
.caseRow[disabled]:hover{border-color:var(--line); background:var(--panel)}

.tile{background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:13px 15px; margin:12px 0}
hr.sep{border:0; border-top:1px solid var(--line); margin:16px 0}
.tagline{
  font-family:var(--fx-mono); font-size:10.5px; letter-spacing:.1em;
  color:var(--dim); text-transform:uppercase;
}
.fx-flash{animation:flash .45s ease-out}
@keyframes flash{from{background:rgba(69,214,198,.35)} to{background:transparent}}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important; transition-duration:.01ms!important}
}

/* Portraits */
.portrait-row{display:flex; gap:14px; align-items:flex-start; margin-bottom:6px}
.portrait{
  width:82px; height:82px; flex:0 0 auto; background:var(--panel-2);
  border:1px solid var(--line-2); border-radius:3px; overflow:hidden;
  image-rendering:pixelated;
}
.portrait svg{display:block; width:100%; height:100%}
.portrait-row .who-block{flex:1 1 auto; min-width:0}
.portrait-row .who-name{
  font-family:var(--fx-hud); font-size:11px; font-weight:700; letter-spacing:.14em;
  text-transform:uppercase; color:var(--accent); margin-bottom:2px;
}
.portrait-row .who-role{
  font-family:var(--fx-mono); font-size:10px; color:var(--dim);
  letter-spacing:.06em; text-transform:uppercase; margin-bottom:8px;
}
.portrait-row.cool .who-name{color:var(--evi)}
/* Intro chapter card */
.chapter{
  border-top:1px solid var(--line-2); border-bottom:1px solid var(--line-2);
  padding:16px 0; margin:14px 0; text-align:center;
}
.chapter .k{
  font-family:var(--fx-mono); font-size:10px; letter-spacing:.24em;
  text-transform:uppercase; color:var(--dim);
}
.chapter .v{
  font-family:var(--fx-hud); font-size:22px; font-weight:700;
  letter-spacing:.02em; color:var(--ink); margin-top:4px;
}

@media (max-width:430px){
  h1{font-size:27px} h2{font-size:21px}
  .sentence{font-size:16px; padding:13px; line-height:1.85}
  .slot{min-width:98px; font-size:11.5px}
  #hud .caseName{font-size:15px}
}
</style>

<div id="app">
  <div id="hud">
    <span class="rank" id="hRank">ROOKIE</span>
    <span class="caseName" id="hCase">COLD READ</span>
    <span class="sceneTag" id="hScene"></span>
    <span class="stamp">GREYBOX</span>
    <div id="timerWrap" hidden><div id="timerBar"></div></div>
  </div>

  <div id="stage">
    <canvas id="gc"></canvas>
    <div class="ov" id="ovTitle"></div>
    <div class="ov" id="ovPanel" hidden></div>
  </div>

  <div id="foot">
    <span id="hint">Tap a case to start</span>
    <div id="evBag"></div>
  </div>
</div>

<script>
(function(){
'use strict';

/* ============================================================
   COLD READ — greybox engine
   Scene templates are fixed code; cases are pure data (CASES).
   ============================================================ */

var cv = document.getElementById('gc');
var ctx = cv.getContext('2d');
var stage = document.getElementById('stage');
var elHint = document.getElementById('hint');
var elCase = document.getElementById('hCase');
var elRank = document.getElementById('hRank');
var elScene = document.getElementById('hScene');
var elBag = document.getElementById('evBag');
var elTimerWrap = document.getElementById('timerWrap');
var elTimerBar = document.getElementById('timerBar');
var ovTitle = document.getElementById('ovTitle');
var ovPanel = document.getElementById('ovPanel');

var W = 0, H = 0, DPR = 1;

/* ---------- persistent state ---------- */
var S = {
  caseIdx: 0, sceneIdx: 0, unlocked: 1,
  flags: {}, trust: { dash:1, patch:1, juno:1, sol:1, wren:1, kemi:0 },
  mirror: { bridge:0, back:0, highway:0, docks:0, smashed:0, precise:0, hesitate:0, left:0, right:0 },
  stars: {}, evidence: [], reviveUsed: 0
};

function save(){
  try{ localStorage.setItem('coldread.gb', JSON.stringify(S)); }catch(e){}
}
function load(){
  try{
    var raw = localStorage.getItem('coldread.gb');
    if(raw){ var o = JSON.parse(raw); if(o && typeof o === 'object'){ for(var k in o) S[k] = o[k]; } }
  }catch(e){}
}

/* ---------- canvas sizing ---------- */
function resize(){
  var r = stage.getBoundingClientRect();
  W = Math.max(1, Math.round(r.width));
  H = Math.max(1, Math.round(r.height));
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if(Scene.cur && Scene.cur.resize) Scene.cur.resize();
}
window.addEventListener('resize', resize);

/* ---------- small helpers ---------- */
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function rnd(a,b){ return a+Math.random()*(b-a); }
function pick(arr){ return arr[(Math.random()*arr.length)|0]; }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
  return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }

/* pseudo-3D road projection: x in lane units, z depth ahead */
var HZF = 0.34;
function proj(x, z){
  var s = 7 / (z + 7);
  return { x: W/2 + x * (W*0.34) * s, y: H*HZF + (H - H*HZF) * s * 0.88, s: s };
}
/* isometric helper for interiors */
function iso(x, y, z, ox, oy, sc){
  return { x: ox + (x - z) * 0.866 * sc, y: oy + (x + z) * 0.5 * sc - y * sc };
}

function fillPoly(pts, col){
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for(var i=1;i<pts.length;i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath(); ctx.fillStyle = col; ctx.fill();
}

/* draw an axis-aligned "brick" box in road space */
function roadBox(x, z, wid, hgt, cols){
  var p0 = proj(x - wid/2, z), p1 = proj(x + wid/2, z);
  var top = p0.y - hgt * p0.s * H * 0.30;
  var w = p1.x - p0.x;
  ctx.fillStyle = cols[0];
  ctx.fillRect(p0.x, top, w, p0.y - top);
  ctx.fillStyle = cols[1];
  ctx.fillRect(p0.x, top, w, Math.max(1.5, 4*p0.s));       /* lit top edge */
  ctx.fillStyle = cols[2];
  ctx.fillRect(p0.x, top, Math.max(1.5, w*0.22), p0.y-top);  /* shaded side */
  return { x:p0.x, y:top, w:w, h:p0.y-top, s:p0.s };
}

function shade(hex, f){
  var n = parseInt(hex.slice(1),16);
  var r = clamp(((n>>16)&255)*f,0,255)|0, g = clamp(((n>>8)&255)*f,0,255)|0, b = clamp((n&255)*f,0,255)|0;
  return 'rgb('+r+','+g+','+b+')';
}

/* ---------- HUD ---------- */
function setHud(caseName, rank, sceneTag){
  if(caseName!=null) elCase.textContent = caseName;
  if(rank!=null) elRank.textContent = rank;
  if(sceneTag!=null) elScene.textContent = sceneTag;
}
function setHint(t){ elHint.textContent = t; }
function setTimer(frac, col){
  if(frac==null){ elTimerWrap.hidden = true; return; }
  elTimerWrap.hidden = false;
  elTimerBar.style.width = (clamp(frac,0,1)*100).toFixed(1)+'%';
  elTimerBar.style.background = col || 'var(--accent)';
}
function renderBag(found, total){
  elBag.innerHTML = '';
  for(var i=0;i<total;i++){
    var d = document.createElement('span');
    d.className = 'evDot' + (i<found ? ' on' : '');
    elBag.appendChild(d);
  }
}

/* ---------- overlay panel ---------- */
function panel(html){
  ovPanel.innerHTML = '<div class="sheet">'+html+'</div>';
  ovPanel.hidden = false;
  ovPanel.scrollTop = 0;
  /* Guard: a player mashing the screen during a timed scene must not blow
     straight through the result panel and the decision behind it. */
  ovPanel.style.pointerEvents = 'none';
  clearTimeout(panel._t);
  panel._t = setTimeout(function(){ ovPanel.style.pointerEvents = ''; }, 360);
}
function hidePanel(){ ovPanel.hidden = true; ovPanel.innerHTML=''; }

/* ---------- input ---------- */
var press = null;
stage.addEventListener('pointerdown', function(e){
  if(!ovPanel.hidden || !ovTitle.hidden) return;
  var r = stage.getBoundingClientRect();
  press = { x:e.clientX-r.left, y:e.clientY-r.top, t:performance.now(), moved:false };
  if(Scene.cur && Scene.cur.onHold) Scene.cur.onHold(true);
});
stage.addEventListener('pointermove', function(e){
  if(!press) return;
  var r = stage.getBoundingClientRect();
  var dx = (e.clientX-r.left)-press.x, dy = (e.clientY-r.top)-press.y;
  if(Math.abs(dx)>26 || Math.abs(dy)>26){
    if(!press.moved){
      press.moved = true;
      var dir = Math.abs(dx) > Math.abs(dy) ? (dx>0?'right':'left') : (dy>0?'down':'up');
      if(Scene.cur && Scene.cur.onSwipe) Scene.cur.onSwipe(dir);
    }
  }
});
function endPress(e){
  if(!press) return;
  if(Scene.cur && Scene.cur.onHold) Scene.cur.onHold(false);
  if(!press.moved && Scene.cur && Scene.cur.onTap){
    var r = stage.getBoundingClientRect();
    Scene.cur.onTap(e.clientX-r.left, e.clientY-r.top);
  }
  press = null;
}
stage.addEventListener('pointerup', endPress);
stage.addEventListener('pointercancel', function(){ 
  if(Scene.cur && Scene.cur.onHold) Scene.cur.onHold(false);
  press=null; 
});

window.addEventListener('keydown', function(e){
  if(!Scene.cur) return;
  var m = {ArrowLeft:'left', ArrowRight:'right', ArrowUp:'up', ArrowDown:'down'};
  if(m[e.key] && Scene.cur.onSwipe){ e.preventDefault(); Scene.cur.onSwipe(m[e.key]); }
  if((e.key===' '||e.key==='Enter')){
    e.preventDefault();
    if(Scene.cur.onHold) Scene.cur.onHold(true);
    if(Scene.cur.onTap) Scene.cur.onTap(W/2, H/2);
  }
});
window.addEventListener('keyup', function(e){
  if(e.key===' ' && Scene.cur && Scene.cur.onHold) Scene.cur.onHold(false);
});

/* ---------- scene manager ---------- */
var Scene = { cur:null, done:null };


/* ============================================================
   CHARACTER PORTRAITS
   Procedural brick-voxel faces via inline SVG. No assets.
   Each character has a distinctive silhouette so a returning
   player recognizes them across a dozen cases.
   ============================================================ */
var FACES = {
  rook:  { skin:'#8D5A3C', hair:'#1F1614', hairShape:'flat',  brow:'#221510', shirt:'#20364A', badge:'#FF6A2B', role:'You' },
  ife:   { skin:'#6B3A22', hair:'#0E0D0C', hairShape:'wrap',  brow:'#1B1108', shirt:'#243244', badge:'#F2C14E', role:'Commander' },
  dash:  { skin:'#9C6642', hair:'#2A1F1B', hairShape:'buzz',  brow:'#291D14', shirt:'#1F2A32', badge:'#45D6C6', role:'Partner' },
  patch: { skin:'#7A4A2E', hair:'#2C241F', hairShape:'puff',  brow:'#2A1E15', shirt:'#3D3830', badge:'#93D651', role:'Forensics' },
  juno:  { skin:'#5F3320', hair:'#8B2A1F', hairShape:'braids',brow:'#241811', shirt:'#2A2A38', badge:'#EF4D63', role:'Hacker' },
  sol:   { skin:'#4A2A18', hair:'#141110', hairShape:'flat',  brow:'#1C1108', shirt:'#33332B', badge:'#F2C14E', role:'Breacher' },
  wren:  { skin:'#8A5732', hair:'#1F1614', hairShape:'braids',brow:'#25170F', shirt:'#4A3040', badge:'#45D6C6', role:'Negotiator' },
  kemi:  { skin:'#7A4926', hair:'#B8722A', hairShape:'puff',  brow:'#2E1D0F', shirt:'#3A2828', badge:'#F2C14E', role:'Journalist' },
  spool: { skin:'#734424', hair:'#151312', hairShape:'buzz',  brow:'#1F130A', shirt:'#2A2422', badge:'#EF4D63', role:'Kites crew' },
  ada:   { skin:'#C8967A', hair:'#F0E6D8', hairShape:'sleek', brow:'#8A776A', shirt:'#0E1418', badge:'#45D6C6', role:'Sightline' },
  driver:{ skin:'#7E4A2A', hair:'#1A130E', hairShape:'flat',  brow:'#25160C', shirt:'#3A2E24', badge:'#93D651', role:'Detained' },
  needle:{ skin:'#835228', hair:'#1E1610', hairShape:'buzz',  brow:'#241609', shirt:'#26302A', badge:'#EF4D63', role:'Runner' }
};

function portraitSVG(id){
  var f = FACES[id] || FACES.rook;
  var hair = hairPath(f.hairShape);
  return (
    '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">'+
      /* backdrop panel */
      '<rect x="0" y="0" width="24" height="24" fill="#19262D"/>'+
      /* shoulders / shirt */
      '<rect x="3" y="18" width="18" height="6" fill="'+f.shirt+'"/>'+
      '<rect x="10" y="18" width="4" height="6" fill="'+f.badge+'"/>'+
      /* neck */
      '<rect x="10" y="16" width="4" height="3" fill="'+shade(f.skin,0.85)+'"/>'+
      /* head base */
      '<rect x="6" y="6" width="12" height="12" fill="'+f.skin+'"/>'+
      /* head shading (right side) */
      '<rect x="15" y="6" width="3" height="12" fill="'+shade(f.skin,0.85)+'"/>'+
      /* jaw shadow */
      '<rect x="6" y="15" width="12" height="1" fill="'+shade(f.skin,0.78)+'"/>'+
      hair+
      /* brow */
      '<rect x="8" y="10" width="3" height="1" fill="'+f.brow+'"/>'+
      '<rect x="13" y="10" width="3" height="1" fill="'+f.brow+'"/>'+
      /* eyes */
      '<rect x="8" y="11" width="2" height="2" fill="#101418"/>'+
      '<rect x="14" y="11" width="2" height="2" fill="#101418"/>'+
      /* mouth */
      '<rect x="10" y="15" width="4" height="1" fill="'+shade(f.skin,0.55)+'"/>'+
    '</svg>'
  );
}
function hairPath(shape){
  if(shape==='buzz')   return '<rect x="6" y="6" width="12" height="2" fill="#0F0C0B" opacity=".9"/>';
  if(shape==='flat')   return '<rect x="6" y="5" width="12" height="3" fill="#141110"/>';
  if(shape==='wrap')   return '<rect x="5" y="5" width="14" height="4" fill="#F2C14E"/><rect x="5" y="9" width="14" height="1" fill="#B08A2E"/>';
  if(shape==='puff')   return '<rect x="5" y="4" width="14" height="4" fill="#2E2620"/><rect x="4" y="6" width="2" height="4" fill="#2E2620"/><rect x="18" y="6" width="2" height="4" fill="#2E2620"/>';
  if(shape==='braids') return '<rect x="6" y="5" width="12" height="3" fill="#1F1614"/><rect x="5" y="8" width="2" height="8" fill="#1F1614"/><rect x="17" y="8" width="2" height="8" fill="#1F1614"/>';
  if(shape==='sleek')  return '<rect x="6" y="6" width="12" height="2" fill="#F0E6D8"/><rect x="6" y="8" width="1" height="6" fill="#F0E6D8"/>';
  return '<rect x="6" y="6" width="12" height="2" fill="#181614"/>';
}

var TEMPLATES = {};

Scene.play = function(cfg, onDone){
  if(Scene.cur && Scene.cur.exit) Scene.cur.exit();
  hidePanel();
  setTimer(null);
  renderBag(0,0);
  var t = TEMPLATES[cfg.type];
  if(!t){ console.warn('no template', cfg.type); onDone(); return; }
  Scene.cur = t();
  Scene.done = onDone;
  elScene.textContent = (cfg.type||'').replace(/_/g,' ');
  Scene.cur.enter(cfg, function(result){
    var d = Scene.done; Scene.done = null;
    if(d) d(result||{});
  });
};

var lastT = 0;
function loop(now){
  var dt = Math.min(0.05, (now - lastT)/1000 || 0);
  lastT = now;
  ctx.clearRect(0,0,W,H);
  if(Scene.cur){
    if(Scene.cur.update) Scene.cur.update(dt);
    if(Scene.cur.draw) Scene.cur.draw();
  }
  requestAnimationFrame(loop);
}

/* ============================================================
   SHARED WORLD DRAWING
   ============================================================ */
var DISTRICT = {
  market_mile: { sky:'#241A16', ground:'#171E20', block:'#2E3940', accent:'#FF6A2B', label:'MARKET MILE · DUSK' },
  the_stacks:  { sky:'#10161F', ground:'#131A1E', block:'#28333C', accent:'#F2C14E', label:'THE STACKS · NIGHT' },
  portside:    { sky:'#0D1A1E', ground:'#101A1D', block:'#25343A', accent:'#45D6C6', label:'PORTSIDE · RAIN' }
};
function dstr(id){ return DISTRICT[id] || DISTRICT.market_mile; }

function drawSky(d){
  var g = ctx.createLinearGradient(0,0,0,H*HZF);
  g.addColorStop(0, shade(d.sky,0.55)); g.addColorStop(1, d.sky);
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H*HZF+1);
  ctx.fillStyle = d.ground; ctx.fillRect(0,H*HZF,W,H-H*HZF);
}
/* parallax skyline of plain blocks */
function drawSkyline(d, off){
  ctx.fillStyle = shade(d.block,0.55);
  var n = 26, bw = W/14;
  for(var i=0;i<n;i++){
    var seed = (i*97)%37;
    var x = ((i*bw - off*0.25) % (W+bw*2)) - bw;
    var h = H*HZF*(0.28 + (seed%7)/12);
    ctx.fillRect(x, H*HZF-h, bw*0.82, h);
  }
}
/* road surface + lane marks */
function drawRoad(d, scroll, lanes){
  var pts=[], i;
  for(i=0;i<=24;i++){
    var z = -0.55 + i*0.92;
    var a = proj(-1.75, z), b = proj(1.75, z);
    pts.push([a,b]);
  }
  ctx.beginPath();
  ctx.moveTo(pts[0][0].x, pts[0][0].y);
  for(i=1;i<pts.length;i++) ctx.lineTo(pts[i][0].x, pts[i][0].y);
  for(i=pts.length-1;i>=0;i--) ctx.lineTo(pts[i][1].x, pts[i][1].y);
  ctx.closePath();
  ctx.fillStyle = shade(d.ground,1.5); ctx.fill();
  /* dashes */
  ctx.fillStyle = 'rgba(200,215,220,.30)';
  for(var L=-1; L<=1; L+=2){
    if(lanes===1) break;
    for(var k=0;k<16;k++){
      var z0 = ((k*1.6) - (scroll%1.6));
      if(z0 < 0.15) continue;
      var p0 = proj(L*0.58, z0), p1 = proj(L*0.58, z0+0.55);
      var w = Math.max(1, 5*p0.s);
      ctx.fillRect(p0.x-w/2, p1.y, w, Math.max(1,p0.y-p1.y));
    }
  }
  /* edge kerbs */
  ctx.strokeStyle = shade(d.block,1.25); ctx.lineWidth = 1.5;
  for(var E=-1;E<=1;E+=2){
    ctx.beginPath();
    for(i=0;i<pts.length;i++){
      var p = proj(E*1.75, i*0.9);
      if(i===0) ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y);
    }
    ctx.stroke();
  }
}
/* roadside buildings */
function drawSides(d, scroll){
  for(var k=18;k>=0;k--){
    var z = k*1.35 - (scroll % 1.35);
    if(z < 0.4) continue;
    var hgt = 0.6 + ((k*53)%9)/10;
    roadBox(-2.9 - ((k*31)%5)/9, z, 1.9, hgt, [d.block, shade(d.block,1.35), shade(d.block,0.7)]);
    roadBox( 2.9 + ((k*17)%5)/9, z, 1.9, hgt*0.92, [d.block, shade(d.block,1.35), shade(d.block,0.7)]);
  }
}
function vignette(){
  var g = ctx.createRadialGradient(W/2,H*0.55,H*0.2, W/2,H*0.55,H*0.85);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,.45)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
}
function bigLabel(txt, sub){
  ctx.textAlign='center';
  ctx.font = '700 '+Math.min(40, W*0.085)+'px "Barlow Condensed", sans-serif';
  ctx.fillStyle = '#E4EDF0';
  ctx.fillText(txt, W/2, H*0.5);
  if(sub){
    ctx.font = '400 12px "JetBrains Mono", monospace';
    ctx.fillStyle = '#7C939E';
    ctx.fillText(sub, W/2, H*0.5+22);
  }
  ctx.textAlign='left';
}

   INTRO — Rook's backstory, plays once on new-game

TEMPLATES.intro = function(){
  var cfg, done, d, t=0, idx=0, beats=[];
  return {
    enter:function(c, cb){
      cfg=c; done=cb; d=dstr(c.district||'market_mile'); t=0; idx=0;
      beats = c.beats||[];
      setHint('Tap to continue');
      showBeat();
    },
    update:function(dt){ t+=dt; },
    draw:function(){
      /* slow, quiet backdrop — this is a memory, not a chase */
      drawSky(d); drawSkyline(d, t*4); drawRoad(d, t*0.3, 3); drawSides(d, t*0.3);
      /* dim the whole thing so the panel reads */
      ctx.fillStyle='rgba(10,16,19,.55)'; ctx.fillRect(0,0,W,H);
      vignette();
      ctx.font='400 10px "JetBrains Mono", monospace'; ctx.fillStyle='#57686F';
      ctx.fillText('MARKET MILE · ONE YEAR AGO', 14, 22);
    },
    onTap:function(){ /* handled via panel */ },
    exit:function(){ hidePanel(); }
  };
  function showBeat(){
    var B = beats[idx]; if(!B) return;
    var body = '';
    if(B.chapter){
      body += '<div class="chapter"><div class="k">'+esc(B.chapter.k||'')+'</div><div class="v">'+esc(B.chapter.v||'')+'</div></div>';
    }
    if(B.face && FACES[B.face]){
      var f = FACES[B.face];
      body +=
        '<div class="portrait-row'+(B.face==='rook'?' cool':'')+'">'+
          '<div class="portrait">'+portraitSVG(B.face)+'</div>'+
          '<div class="who-block">'+
            '<div class="who-name">'+esc(B.who||'')+'</div>'+
            '<div class="who-role">'+esc(f.role)+'</div>'+
            '<p class="lede" style="margin:0">'+esc(B.text)+'</p>'+
          '</div>'+
        '</div>';
    } else if(B.narration){
      body += '<div class="eyebrow">'+esc(B.eyebrow||'')+'</div><p class="lede">'+esc(B.narration)+'</p>';
    } else if(B.text){
      body += '<p class="lede">'+esc(B.text)+'</p>';
    }
    var last = (idx === beats.length-1);
    body += '<div class="btnRow" style="margin-top:14px">'+
      (idx>0 ? '<button class="btn ghost" id="bBack">Back</button>' : '')+
      '<button class="btn" id="bNext">'+(last?'Take the badge':'Continue')+'</button></div>'+
      '<p class="mono" style="margin-top:10px;text-align:center">'+(idx+1)+' / '+beats.length+'</p>';
    panel(body);
    var nx = document.getElementById('bNext');
    nx.onclick = function(){
      if(last){ hidePanel(); done({}); }
      else { idx++; showBeat(); }
    };
    var bk = document.getElementById('bBack');
    if(bk) bk.onclick = function(){ idx = Math.max(0, idx-1); showBeat(); };
  }
};

/* ============================================================
   BREACH — smash-search under a timer
   ============================================================ */
TEMPLATES.breach = function(){
  var cfg, done, d, objs=[], parts=[], time=0, total=0, found=[], t=0, ended=false;
  var traceT = -99, hasTrace = false, smashCount = 0;

  function build(){
    objs=[]; parts=[]; found=[]; t=0; ended=false; smashCount=0;
    var ev = cfg.evidence || [];
    var decoys = cfg.decoys || [];
    var n = Math.max(ev.length + decoys.length + 5, 9);
    var cols = 4, sc = W*0.108;
    var ox = W/2, oy = H*0.46;
    var slots = [];
    for(var r=0;r<Math.ceil(n/cols);r++)
      for(var c2=0;c2<cols;c2++) slots.push([c2*1.5 - 2.25, r*1.5 - 1.1]);
    /* shuffle */
    for(var i=slots.length-1;i>0;i--){ var j=(Math.random()*(i+1))|0; var tmp=slots[i]; slots[i]=slots[j]; slots[j]=tmp; }
    var payloads = [];
    ev.forEach(function(e){ payloads.push({kind:'ev', data:e}); });
    decoys.forEach(function(e){ payloads.push({kind:'decoy', data:e}); });
    while(payloads.length < n) payloads.push({kind:'empty'});
    var heavyKinds = ['CRATE','LOCKER','DUFFEL','SAFE'];
    var lightKinds = ['BIN','SHELF','SACK'];
    for(var k=0;k<n;k++){
      var s = slots[k%slots.length];
      var pl = payloads[k];
      /* Half the real evidence is stashed in heavy containers (2 hits, then a
         reveal of the item inside, then a bag tap). Rewards patience over mashing. */
      var heavy;
      if(pl.kind==='ev')      heavy = ((k*13+3)%2)===0;
      else if(pl.kind==='decoy') heavy = ((k*7)%2)===0;
      else                     heavy = ((k*17)%4)===0; /* a few empty heavies as red herrings */
      objs.push({
        gx:s[0], gz:s[1], h: 0.75+((k*37)%5)/7,
        ox:ox, oy:oy, sc:sc,
        payload: pl,
        tier: heavy ? 'heavy' : 'light',
        kind: heavy ? heavyKinds[k%heavyKinds.length] : lightKinds[k%lightKinds.length],
        needHits: heavy ? 2 : 1,
        hits: 0, cracks: 0,
        innerRevealed:false, revealT:0, bagged:false,
        dead:false, hit:0
      });
    }
    total = ev.length;
  }

  function hitTest(px,py){
    for(var i=objs.length-1;i>=0;i--){
      var o = objs[i]; if(o.dead) continue;
      var b = boxOf(o);
      if(px>=b.x && px<=b.x+b.w && py>=b.y && py<=b.y+b.h) return o;
    }
    return null;
  }
  function boxOf(o){
    var p = iso(o.gx, 0, o.gz, o.ox, o.oy, o.sc);
    var w = o.sc*1.0, hh = o.sc*o.h*1.25;
    return { x:p.x-w/2, y:p.y-hh, w:w, h:hh+o.sc*0.25 };
  }

  return {
    enter:function(c, cb){
      cfg=c; done=cb; d=dstr(c.district);
      time = c.time_s || 40;
      hasTrace = !!c.trace;
      build();
      renderBag(0, total);
      setHint(hasTrace ? 'Tap to smash · swipe up for TRACE' : 'Tap objects to smash and search');
    },
    resize:function(){ build(); renderBag(found.length, total); },
    update:function(dt){
      t+=dt;
      if(ended) return;
      time -= dt;
      setTimer(time/(cfg.time_s||40), time<8 ? 'var(--warn)' : 'var(--accent)');
      for(var i=parts.length-1;i>=0;i--){
        var p=parts[i]; p.vy+=760*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt;
        p.rot += p.vr*dt;
        if(p.life<=0) parts.splice(i,1);
      }
      if(time<=0 || found.length>=total){ finish(); }
    },
    draw:function(){
      /* interior ground */
      ctx.fillStyle = shade(d.ground,0.8); ctx.fillRect(0,0,W,H);
      var sc = W*0.108, ox=W/2, oy=H*0.46;
      /* floor plate */
      var c1=iso(-3.1,0,-1.9,ox,oy,sc), c2=iso(3.7,0,-1.9,ox,oy,sc),
          c3=iso(3.7,0,3.9,ox,oy,sc), c4=iso(-3.1,0,3.9,ox,oy,sc);
      fillPoly([[c1.x,c1.y],[c2.x,c2.y],[c3.x,c3.y],[c4.x,c4.y]], shade(d.block,0.50));
      /* back walls */
      var w1=iso(-3.1,2.6,-1.9,ox,oy,sc), w2=iso(3.7,2.6,-1.9,ox,oy,sc);
      fillPoly([[c1.x,c1.y],[c2.x,c2.y],[w2.x,w2.y],[w1.x,w1.y]], shade(d.block,0.45));

      objs.slice().sort(function(a,b){ return (a.gx+a.gz)-(b.gx+b.gz); }).forEach(function(o){
        if(o.dead) return;
        var revealed = hasTrace && (t-traceT)<1.6 && o.payload.kind!=='empty';
        var isHeavy = o.tier==='heavy';
        var baseCol = o.payload.kind==='empty' ? '#465964' : (isHeavy ? '#3F5460' : '#4C6270');
        if(revealed) baseCol = o.payload.kind==='ev' ? '#3E9E96' : '#9A5A54';
        var p = iso(o.gx, 0, o.gz, o.ox, o.oy, o.sc);
        var w = o.sc*0.98;
        /* If inner has been revealed, draw only a short stub of the broken container
           and the inner item floating above it. */
        if(o.innerRevealed){
          var stubH = o.sc*0.32;
          ctx.fillStyle = shade('#2E3A42', 1.0);
          ctx.fillRect(p.x-w/2, p.y-stubH, w, stubH);
          ctx.fillStyle = shade('#2E3A42', 0.62);
          ctx.fillRect(p.x-w/2, p.y-stubH, w*0.24, stubH);
          /* jagged rim */
          ctx.fillStyle = '#1B242A';
          for(var jj=0;jj<5;jj++){
            var jx = p.x-w/2 + (w/5)*jj;
            var jy = p.y-stubH - ((jj%2)? 3 : 6);
            ctx.fillRect(jx, jy, w/5, 3);
          }
          /* inner item — pulsing */
          var pulse = 0.7 + 0.3*Math.sin((t-o.revealT)*6);
          var innerCol = o.payload.kind==='ev' ? '#45D6C6' : '#EF4D63';
          var iw = o.sc*0.42, ih = o.sc*0.42;
          var iy = p.y - stubH - ih - 4 + Math.sin((t-o.revealT)*4)*2;
          ctx.globalAlpha = pulse;
          ctx.fillStyle = shade(innerCol, 0.55);
          ctx.fillRect(p.x-iw/2, iy, iw, ih);
          ctx.fillStyle = shade(innerCol, 1.1);
          ctx.fillRect(p.x-iw/2, iy, iw, Math.max(2, ih*0.22));
          ctx.globalAlpha = 1;
          /* halo */
          ctx.strokeStyle = 'rgba(255,255,255,'+(0.35*pulse).toFixed(2)+')';
          ctx.lineWidth = 1;
          ctx.strokeRect(p.x-iw/2-2, iy-2, iw+4, ih+4);
          /* tap hint */
          ctx.fillStyle = '#DDE5E8';
          ctx.font='700 9px "Barlow Condensed", sans-serif';
          ctx.textAlign='center';
          ctx.fillText('TAP', p.x, iy-6);
          ctx.textAlign='start';
          return;
        }
        var top = iso(o.gx, o.h, o.gz, o.ox, o.oy, o.sc);
        ctx.fillStyle = shade(baseCol, 1.0);
        ctx.fillRect(p.x-w/2, top.y, w, p.y-top.y);
        ctx.fillStyle = shade(baseCol, 1.45);
        ctx.fillRect(p.x-w/2, top.y, w, Math.max(2, o.sc*0.14));
        ctx.fillStyle = shade(baseCol, 0.62);
        ctx.fillRect(p.x-w/2, top.y, w*0.24, p.y-top.y);
        /* heavy containers wear a strap/band so they read as "sealed" */
        if(isHeavy){
          ctx.fillStyle = shade(baseCol, 0.42);
          ctx.fillRect(p.x-w/2, top.y + (p.y-top.y)*0.55, w, Math.max(2, o.sc*0.08));
          /* label */
          ctx.fillStyle = 'rgba(220,232,238,0.55)';
          ctx.font='700 8px "Barlow Condensed", sans-serif';
          ctx.textAlign='center';
          ctx.fillText(o.kind, p.x, top.y + (p.y-top.y)*0.5 + 2);
          ctx.textAlign='start';
        }
        /* cracks — after first hit on a heavy */
        if(o.cracks>0){
          ctx.strokeStyle = 'rgba(255,240,200,0.85)';
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          var cx = p.x, cy = top.y + (p.y-top.y)*0.35;
          ctx.moveTo(cx-w*0.28, cy);
          ctx.lineTo(cx-w*0.08, cy+o.sc*0.10);
          ctx.lineTo(cx+w*0.05, cy-o.sc*0.05);
          ctx.lineTo(cx+w*0.24, cy+o.sc*0.12);
          ctx.moveTo(cx-w*0.10, cy+o.sc*0.10);
          ctx.lineTo(cx-w*0.02, cy+o.sc*0.28);
          ctx.stroke();
        }
        if(o.hit>0){
          ctx.strokeStyle='rgba(255,255,255,'+o.hit.toFixed(2)+')'; ctx.lineWidth=2;
          ctx.strokeRect(p.x-w/2, top.y, w, p.y-top.y);
          o.hit = Math.max(0, o.hit-0.05);
        }
        if(revealed){
          ctx.fillStyle = o.payload.kind==='ev' ? '#45D6C6' : '#EF4D63';
          ctx.fillRect(p.x-3, top.y-11, 6, 6);
        }
      });

      parts.forEach(function(p){
        ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
        ctx.fillStyle=p.c; ctx.globalAlpha=clamp(p.life,0,1);
        ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s); ctx.restore();
      });
      ctx.globalAlpha=1;

      ctx.font='400 11px "JetBrains Mono", monospace'; ctx.fillStyle='#57686F';
      ctx.fillText((cfg.room||'SCENE').toUpperCase()+' · EVIDENCE '+found.length+'/'+total, 14, 22);
      if(hasTrace){
        var ready = (t-traceT)>6;
        ctx.fillStyle = ready ? '#45D6C6' : '#3A4E59';
        ctx.fillText('TRACE '+(ready?'READY':'…'), 14, 38);
      }
    },
    onSwipe:function(dir){
      if(dir==='up' && hasTrace && (t-traceT)>6){ traceT = t; setHint('TRACE: teal = evidence, red = planted'); }
    },
    onTap:function(px,py){
      if(ended) return;
      var o = hitTest(px,py); if(!o) return;
      smashCount++;
      var b = boxOf(o);

      /* Step 3 of a heavy: the inner item is exposed — this tap bags it. */
      if(o.innerRevealed && !o.bagged){
        o.bagged = true; o.dead = true;
        var col = o.payload.kind==='ev' ? '#45D6C6' : '#EF4D63';
        for(var jb=0;jb<16;jb++) parts.push({
          x:b.x+b.w/2, y:b.y+b.h/2,
          vx:rnd(-180,180), vy:rnd(-320,-80),
          s:rnd(3,7), rot:0, vr:rnd(-6,6),
          life:rnd(0.7,1.3), c: col
        });
        if(o.payload.kind==='ev'){
          found.push(o.payload.data);
          renderBag(found.length, total);
          setHint('Bagged: '+o.payload.data.name);
        } else if(o.payload.kind==='decoy'){
          found.push(o.payload.data);
          setHint('Flagged (planted): '+o.payload.data.name);
        }
        return;
      }

      o.hits++;
      o.hit = 1;

      /* Heavy container — first hit only cracks it. */
      if(o.hits < o.needHits){
        o.cracks = 1;
        for(var id=0;id<8;id++) parts.push({
          x:b.x+b.w/2+rnd(-b.w/4,b.w/4), y:b.y+b.h/3+rnd(-6,6),
          vx:rnd(-90,90), vy:rnd(-180,-40),
          s:rnd(3,6), rot:rnd(0,3), vr:rnd(-5,5),
          life:rnd(0.3,0.7), c: pick(['#8A9AA2','#B2C0C6','#5A6E77'])
        });
        setHint(o.kind.toLowerCase()+' cracked — hit again');
        return;
      }

      /* Fully broken. */
      o.hit = 0;
      for(var i=0;i<14;i++){
        parts.push({ x:b.x+b.w/2+rnd(-b.w/3,b.w/3), y:b.y+b.h/2+rnd(-b.h/3,b.h/3),
          vx:rnd(-160,160), vy:rnd(-260,-40), s:rnd(4,10), rot:rnd(0,3), vr:rnd(-7,7),
          life:rnd(0.5,1.1), c: pick(['#44555E','#37474F','#5A6E77']) });
      }

      if(o.payload.kind==='empty'){
        o.dead = true;
        setHint(o.tier==='heavy' ? 'Empty. That took two hits for nothing.' : 'Empty.');
        return;
      }

      if(o.tier==='heavy'){
        /* Reveal — don't kill; wait for the bag tap. */
        o.innerRevealed = true; o.revealT = t;
        setHint('Something inside — tap to bag');
        for(var ir=0;ir<6;ir++) parts.push({
          x:b.x+b.w/2, y:b.y+b.h/3, vx:rnd(-60,60), vy:rnd(-140,-40),
          s:rnd(2,5), rot:0, vr:rnd(-4,4), life:rnd(0.4,0.8),
          c: o.payload.kind==='ev' ? '#45D6C6' : '#EF4D63'
        });
      } else {
        /* Light container — instant bag on smash. */
        o.dead = true;
        if(o.payload.kind==='ev'){
          found.push(o.payload.data);
          renderBag(found.length, total);
          setHint('Bagged: '+o.payload.data.name);
          for(var j=0;j<10;j++) parts.push({ x:b.x+b.w/2, y:b.y+b.h/2, vx:rnd(-120,120), vy:rnd(-300,-90),
            s:rnd(3,7), rot:0, vr:rnd(-6,6), life:rnd(0.6,1.2), c:'#45D6C6' });
        } else if(o.payload.kind==='decoy'){
          found.push(o.payload.data);
          setHint('Flagged (planted): '+o.payload.data.name);
        }
      }
    },
    exit:function(){ setTimer(null); }
  };

  function finish(){
    if(ended) return; ended = true;
    setTimer(null);
    /* Mirror: did they smash everything or work precisely? */
    if(smashCount > (cfg.evidence||[]).length + 2) S.mirror.smashed++; else S.mirror.precise++;
    var missed = total - found.filter(function(e){ return !e.decoy; }).length;
    panel(
      '<div class="eyebrow">Scene cleared</div>'+
      '<h2>'+esc(cfg.room||'Search complete')+'</h2>'+
      '<div class="tile">'+ found.map(function(e){
        return '<div class="kv"><span class="k">'+(e.decoy?'flagged':'evidence')+'</span>'+
               '<span class="v '+(e.decoy?'bad':'cool')+'">'+esc(e.name)+'</span></div>';
      }).join('') + (found.length?'':'<p class="small">Nothing bagged. The timer beat you.</p>') + '</div>'+
      (missed>0 ? '<p class="small">'+missed+' piece(s) of evidence still in there. The read will be harder.</p>' : '')+
      '<button class="btn" id="bNext">Continue</button>'
    );
    document.getElementById('bNext').onclick = function(){ hidePanel(); done({ evidence: found }); };
  }
};

/* ============================================================
   READ — fill the sentence, graded Solid / Shaky / Cold
   ============================================================ */
TEMPLATES.read = function(){
  var cfg, done, sel=null, filled=[];
  return {
    enter:function(c, cb){
      cfg=c; done=cb; sel=null;
      filled = new Array((c.answers||[]).length).fill(null);
      setHint('Tap a card, then tap a blank');
      render();
    },
    draw:function(){
      ctx.fillStyle='#0A1013'; ctx.fillRect(0,0,W,H);
    },
    exit:function(){ hidePanel(); }
  };

  function pool(){
    var p = (S.evidence||[]).slice();
    (cfg.extra||[]).forEach(function(e){ p.push(e); });
    return p;
  }
  function render(){
    var sentence = cfg.sentence || 'The next move is ___.';
    var parts = sentence.split('___');
    var html = '';
    for(var i=0;i<parts.length;i++){
      html += esc(parts[i]);
      if(i < parts.length-1){
        var f = filled[i];
        html += '<span class="slot'+(f?' filled':'')+(sel!==null&&!f?' armed':'')+'" data-slot="'+i+'" tabindex="0">'+
                (f ? esc(f.name) : '?????') + '</span>';
      }
    }
    var cards = pool().map(function(e, i){
      var used = filled.some(function(f){ return f && f.id===e.id; });
      return '<button class="card'+(used?' used':'')+(sel&&sel.id===e.id?' sel':'')+'" data-card="'+i+'" '+(used?'disabled':'')+'>'+
             '<span class="tag">'+esc(e.tag||'evidence')+'</span>'+esc(e.name)+'</button>';
    }).join('');
    panel(
      '<div class="eyebrow cool">The read</div>'+
      '<h2>'+esc(cfg.title||'Put it together')+'</h2>'+
      '<div class="sentence">'+html+'</div>'+
      '<h3>Evidence bag</h3>'+
      '<div class="cards">'+cards+'</div>'+
      '<div class="btnRow"><button class="btn ghost" id="bClear">Clear</button>'+
      '<button class="btn" id="bLock">Lock it in</button></div>'
    );
    ovPanel.querySelectorAll('[data-card]').forEach(function(b){
      b.onclick = function(){ var e = pool()[+b.dataset.card]; sel = (sel && sel.id===e.id) ? null : e; render(); };
    });
    ovPanel.querySelectorAll('[data-slot]').forEach(function(sl){
      var act = function(){
        var i = +sl.dataset.slot;
        if(filled[i]){ filled[i] = null; sel = null; }
        else if(sel){ filled[i] = sel; sel = null; }
        render();
      };
      sl.onclick = act;
      sl.onkeydown = function(ev){ if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); act(); } };
    });
    document.getElementById('bClear').onclick = function(){ filled = filled.map(function(){return null;}); sel=null; render(); };
    document.getElementById('bLock').onclick = grade;
  }
  function grade(){
    var ans = cfg.answers||[];
    var right = 0;
    for(var i=0;i<ans.length;i++){ if(filled[i] && filled[i].id===ans[i]) right++; }
    var g = right===ans.length ? 'solid' : (right>=ans.length-1 && ans.length>1 ? 'shaky' : (right>0 ? 'shaky' : 'cold'));
    if(ans.length===1) g = right===1 ? 'solid' : 'cold';
    var copy = {
      solid: ['Solid read','Every link holds. The chase starts on their bumper.','good'],
      shaky: ['Shaky read','Close, but one link is wrong. You start mid-distance.','' ],
      cold:  ['Cold read','The evidence does not say that. You start far back, and they have an escort.','bad']
    }[g];
    panel(
      '<div class="eyebrow'+(g==='solid'?' cool':'')+'">Read graded</div>'+
      '<h2>'+copy[0]+'</h2>'+
      '<p class="lede">'+copy[1]+'</p>'+
      '<div class="tile">'+ ans.map(function(a,i){
        var f = filled[i], ok = f && f.id===a;
        var nm = (pool().filter(function(e){return e.id===a;})[0]||{}).name || a;
        return '<div class="kv"><span class="k">Blank '+(i+1)+'</span><span class="v '+(ok?'good':'bad')+'">'+
               (f?esc(f.name):'—')+(ok?'':' → '+esc(nm))+'</span></div>';
      }).join('')+'</div>'+
      '<button class="btn" id="bGo">Move</button>'
    );
    document.getElementById('bGo').onclick = function(){ hidePanel(); done({ grade:g }); };
  }
};

/* ============================================================
   INTERCEPT — predict the route, place roadblocks
   ============================================================ */
TEMPLATES.intercept = function(){
  var cfg, done, routes=[], blocks=0, maxBlocks=2, t=0, resolved=null, anim=0, d;

  function build(){
    routes = (cfg.routes||[]).map(function(r, i, arr){
      var n = arr.length;
      var spreadL = -0.82 + (1.64) * (n===1?0.5:i/(n-1));
      var pts = [];
      for(var k=0;k<=10;k++){
        var f = k/10;
        var x = W/2 + (spreadL*W*0.40) * Math.pow(f,1.35) + Math.sin(f*3.1+i)*W*0.03;
        var y = H*0.88 - f*(H*0.70);
        pts.push([x,y]);
      }
      return { id:r.id, name:r.name, kind:r.kind, weight:r.weight||1, pts:pts, blocked:false };
    });
  }
  function nearest(px,py){
    var best=null, bd=1e9;
    routes.forEach(function(r){
      r.pts.forEach(function(p){
        var dx=p[0]-px, dy=p[1]-py, dd=dx*dx+dy*dy;
        if(dd<bd){ bd=dd; best=r; }
      });
    });
    return bd < (Math.min(W,H)*0.14)*(Math.min(W,H)*0.14) ? best : null;
  }

  return {
    enter:function(c, cb){
      cfg=c; done=cb; d=dstr(c.district); t=0; anim=0; resolved=null; blocks=0;
      maxBlocks = c.blocks || 2;
      build();
      setHint('Tap a route to block it · '+maxBlocks+' roadblock(s)');
      setTimer(1,'var(--evi)');
      panel(
        '<div class="eyebrow">Intercept</div>'+
        '<h2>Where do they run?</h2>'+
        '<p class="lede">'+esc(cfg.brief||'Line thickness is how likely each route is, weighted by what you bagged. Block the one you believe.')+'</p>'+
        (cfg.mirror ? '<p class="small" style="color:var(--warn)">Their route AI is leaning away from where you usually block.</p>' : '')+
        '<button class="btn" id="bGo">Open the map</button>'
      );
      document.getElementById('bGo').onclick = function(){ hidePanel(); };
    },
    resize: build,
    update:function(dt){ t+=dt; if(resolved) anim = Math.min(1, anim+dt*0.9); },
    draw:function(){
      ctx.fillStyle = shade(d.ground,0.7); ctx.fillRect(0,0,W,H);
      /* grid */
      ctx.strokeStyle='rgba(60,80,90,.38)'; ctx.lineWidth=1;
      for(var gx=0;gx<W;gx+=Math.max(34,W/12)){ ctx.beginPath(); ctx.moveTo(gx,0); ctx.lineTo(gx,H); ctx.stroke(); }
      for(var gy=0;gy<H;gy+=Math.max(34,W/12)){ ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(W,gy); ctx.stroke(); }

      routes.forEach(function(r){
        var wmax = 0; routes.forEach(function(q){ if(q.weight>wmax) wmax=q.weight; });
        var rel = r.weight / (wmax||1);
        var lw = 3 + rel*15;
        ctx.strokeStyle = r.blocked ? '#EF4D63'
          : 'rgba(' + Math.round(140+rel*95) + ',' + Math.round(165+rel*80) + ',' + Math.round(175+rel*70) + ',' + (0.42+rel*0.5).toFixed(2) + ')';
        if(resolved && resolved.id===r.id) ctx.strokeStyle = r.blocked ? '#FF6A2B' : '#F2C14E';
        ctx.lineWidth = lw; ctx.lineCap='round'; ctx.lineJoin='round';
        ctx.beginPath(); ctx.moveTo(r.pts[0][0], r.pts[0][1]);
        for(var i=1;i<r.pts.length;i++) ctx.lineTo(r.pts[i][0], r.pts[i][1]);
        ctx.stroke();
        /* exit node + label */
        var e = r.pts[r.pts.length-1];
        ctx.fillStyle = r.blocked ? '#EF4D63' : (rel>0.95 ? '#F2C14E' : '#8098A3');
        ctx.fillRect(e[0]-7, e[1]-7, 14, 14);
        ctx.font='700 10px "JetBrains Mono", monospace'; ctx.textAlign='center';
        ctx.fillStyle = r.blocked ? '#EF4D63' : '#C3D2D8';
        ctx.fillText(r.name.toUpperCase(), e[0], e[1]-14);
        ctx.textAlign='left';
        if(r.blocked){
          ctx.strokeStyle='#EF4D63'; ctx.lineWidth=2.5;
          ctx.beginPath(); ctx.moveTo(e[0]-11,e[1]+22); ctx.lineTo(e[0]+11,e[1]+22); ctx.stroke();
        }
      });
      /* origin */
      var o = routes.length ? routes[0].pts[0] : [W/2,H*0.88];
      ctx.fillStyle='#FF6A2B';
      ctx.beginPath(); ctx.arc(o[0],o[1],8+Math.sin(t*4)*1.6,0,7); ctx.fill();
      /* runner blip */
      if(resolved){
        var i2 = Math.min(resolved.pts.length-1, Math.floor(anim*(resolved.pts.length-1)));
        var p = resolved.pts[i2];
        ctx.fillStyle = resolved.blocked ? '#FF6A2B' : '#F2C14E';
        ctx.beginPath(); ctx.arc(p[0],p[1],7,0,7); ctx.fill();
      }
      ctx.font='700 11px "JetBrains Mono", monospace'; ctx.fillStyle='#A9BEC7';
      ctx.fillText('ROADBLOCKS '+(maxBlocks-blocks)+' LEFT', 14, 22);
      ctx.font='400 10px "JetBrains Mono", monospace'; ctx.fillStyle='#6B818C';
      ctx.fillText('THICKER LINE = MORE LIKELY', 14, 38);
    },
    onTap:function(px,py){
      if(resolved) return;
      var r = nearest(px,py); if(!r) return;
      if(r.blocked){ r.blocked=false; blocks--; return; }
      if(blocks>=maxBlocks){ setHint('No roadblocks left — tap a placed one to move it'); return; }
      r.blocked = true; blocks++;
      if(S.mirror[r.kind]!=null) S.mirror[r.kind]++;
      if(blocks>=maxBlocks) resolve();
    },
    exit:function(){ setTimer(null); }
  };

  function resolve(){
    setHint('Tracking…');
    var pool = routes.slice(), wsum = 0;
    /* The Mirror: from case 8 the weights lean away from the player's habit.
       Greybox records the habit now so the shift can be tuned later. */
    pool.forEach(function(r){
      r._w = r.weight * (cfg.mirror && r.blocked ? 0.35 : 1);
      wsum += r._w;
    });
    var roll = Math.random()*wsum, acc=0, chosen=pool[0];
    for(var i=0;i<pool.length;i++){ acc+=pool[i]._w; if(roll<=acc){ chosen=pool[i]; break; } }
    resolved = chosen; anim = 0;
    setTimeout(function(){
      var cut = chosen.blocked;
      panel(
        '<div class="eyebrow'+(cut?' cool':'')+'">'+(cut?'Cut off':'Missed')+'</div>'+
        '<h2>'+esc(chosen.name)+'</h2>'+
        '<p class="lede">'+(cut
          ? 'Your roadblock forced the detour. The pursuit starts close.'
          : 'They took a route you left open. You start behind.')+'</p>'+
        '<button class="btn" id="bGo2">Pursue</button>'
      );
      document.getElementById('bGo2').onclick = function(){ hidePanel(); done({ cut: cut, route: chosen.id }); };
    }, 1400);
  }
};

/* ============================================================
   CHASE CORE — shared by foot_chase and pursuit
   ============================================================ */
function makeChase(opts){
  return function(){
    var cfg, done, d, lane=0, laneX=0, obst=[], t=0, scroll=0;
    var gap, gap0, speed, hits=0, hp, nitro=0, holding=false, ended=false, shake=0, airT=0, slideT=0;
    var guided=false, gt=0;
    var ramCD = 0, msg='', msgT=0;

    function reset(){
      obst=[]; t=0; scroll=0; hits=0; lane=0; laneX=0; ended=false; shake=0; airT=0; slideT=0;
      nitro = opts.nitro ? 1 : 0; ramCD=0;
      var g = cfg._grade || 'solid';
      gap0 = opts.foot ? 26 : ({solid:18, shaky:30, cold:44})[g];
      if(cfg._cut) gap0 *= 0.6;
      gap = gap0;
      hp = cfg.hp || (opts.foot ? 1 : 3);
      speed = opts.foot ? 9 : 13;
      guided = (cfg.canFail === false);
      gt = 0;
    }
    function say(s){ msg=s; msgT=1.6; setHint(s); }

    return {
      enter:function(c, cb){
        cfg=c; done=cb; d=dstr(c.district);
        reset();
        setHint(opts.foot ? 'Swipe left/right to weave · up to vault · down to slide'
                          : 'Swipe to change lane · tap to RAM · hold for NITRO');
      },
      update:function(dt){
        if(ended) return;
        t+=dt; scroll += speed*dt*(holding&&nitro>0?1.6:1);
        if(msgT>0) msgT-=dt;
        if(shake>0) shake=Math.max(0,shake-dt*3);
        if(airT>0) airT-=dt; if(slideT>0) slideT-=dt;
        if(ramCD>0) ramCD-=dt;

        laneX = lerp(laneX, lane, Math.min(1, dt*11));

        /* nitro burn */
        if(holding && nitro>0){ nitro=Math.max(0,nitro-dt*0.55); if(!guided) gap -= 5.5*dt; else gt += dt*1.6; }
        else if(nitro<1 && opts.nitro) nitro = Math.min(1, nitro+dt*0.12);

        /* close the gap */
        if(guided){ gt += dt; gap = gap0 * Math.max(0, 1 - gt/14); }
        else gap -= (opts.foot ? 3.6 : 2.9) * dt;

        /* spawn obstacles */
        if(Math.random() < dt*(opts.foot?1.25:1.15)){
          obst.push({ z: 30, lane: (Math.random()*3|0)-1, kind: (opts.foot && Math.random()<0.35) ? 'low' : 'solid' });
        }
        for(var i=obst.length-1;i>=0;i--){
          var o = obst[i];
          o.z -= speed*dt*(holding&&nitro>0?1.6:1);
          if(o.z < -1.5){ obst.splice(i,1); continue; }
          if(o.z<0.9 && o.z>-0.4 && Math.abs(o.lane - laneX) < 0.55 && !o.tagged){
            var dodged = (o.kind==='low' && slideT>0) || (o.kind==='solid' && opts.foot && airT>0);
            if(!dodged){
              o.tagged = true; hits++; shake=1;
              if(!guided) gap += opts.foot ? 2 : 3;
              say(opts.foot ? 'Clipped a stall — they gained ground' : 'You hit traffic');
              if(!opts.canFail && hits>=99) {}
              if(opts.canFail!==false && hits >= (cfg.maxHits||4)) return fail();
            } else { o.tagged = true; }
          }
        }

        /* caught up? */
        if(gap <= 0.6){
          if(opts.foot){ return win(); }
          if(hp<=0) return win();
        }
        setTimer(clamp(gap/gap0,0,1), gap<gap0*0.3 ? 'var(--ok)' : 'var(--accent)');
      },
      draw:function(){
        ctx.save();
        if(shake>0) ctx.translate(rnd(-4,4)*shake, rnd(-3,3)*shake);
        drawSky(d); drawSkyline(d, scroll*6);
        drawRoad(d, scroll, 3); drawSides(d, scroll);

        /* target ahead */
        var tz = clamp(gap*0.55, 0.9, 26);
        var tc = opts.foot ? ['#B4553C','#D4715A','#7E3A29'] : ['#8C4A3A','#B0614D','#5E3126'];
        roadBox(Math.sin(t*1.1)*0.75, tz, opts.foot?0.36:0.82, opts.foot?0.46:0.44, tc);

        /* obstacles */
        obst.slice().sort(function(a,b){return b.z-a.z;}).forEach(function(o){
          if(o.z<=0.05) return;
          var col = o.kind==='low' ? ['#4B5A34','#67794A','#333F24'] : ['#40505A','#5A6E79','#2C383F'];
          roadBox(o.lane*0.85, o.z, o.kind==='low'?0.7:0.62, o.kind==='low'?0.16:0.5, col);
        });

        /* player */
        var py = airT>0 ? 0.34 : 0;
        var ph = slideT>0 ? 0.20 : (opts.foot?0.44:0.40);
        var pb = roadBox(laneX*0.85, 0.85, opts.foot?0.34:0.78, ph, ['#2E6F6A','#45D6C6','#1C4A47']);
        if(py>0){ }
        /* siren bar on the cruiser */
        if(!opts.foot){
          ctx.fillStyle = (t*6|0)%2 ? '#FF6A2B' : '#45D6C6';
          ctx.fillRect(pb.x+pb.w*0.22, pb.y-5, pb.w*0.56, 4);
        }
        ctx.restore();
        vignette();

        /* readouts */
        ctx.font='400 11px "JetBrains Mono", monospace';
        ctx.fillStyle='#57686F';
        ctx.fillText('GAP '+gap.toFixed(1)+'  HITS '+hits+(opts.foot?'':'  HP '+hp), 14, 22);
        if(opts.nitro){
          ctx.fillStyle = nitro>0.15 ? '#F2C14E' : '#3A4E59';
          ctx.fillRect(14, 30, 70*nitro, 4);
          ctx.strokeStyle='#3A4E59'; ctx.lineWidth=1; ctx.strokeRect(14,30,70,4);
          ctx.fillStyle='#57686F'; ctx.fillText('NITRO', 90, 35);
        }
        if(msgT>0){
          ctx.textAlign='center';
          ctx.font='600 15px "Barlow Condensed", sans-serif';
          ctx.fillStyle='rgba(228,237,240,'+clamp(msgT,0,1)+')';
          ctx.fillText(msg, W/2, H*0.24);
          ctx.textAlign='left';
        }
      },
      onSwipe:function(dir){
        if(ended) return;
        if(dir==='left'){ lane=clamp(lane-1,-1,1); S.mirror.left++; }
        else if(dir==='right'){ lane=clamp(lane+1,-1,1); S.mirror.right++; }
        else if(dir==='up' && opts.foot){ airT=0.55; }
        else if(dir==='down' && opts.foot){ slideT=0.55; }
      },
      onHold:function(down){ holding = down; },
      onTap:function(){
        if(ended || opts.foot) return;
        if(ramCD>0) return;
        if(gap < 3.2){ hp--; ramCD=0.45; shake=1;
          say(hp<=0 ? 'Takedown!' : 'Ram — '+hp+' to go');
          if(hp<=0) win();
        } else { ramCD=0.25; say('Too far to ram'); }
      },
      exit:function(){ setTimer(null); }
    };

    function win(){
      if(ended) return; ended=true; setTimer(null);
      var stars = hits===0 ? 3 : (hits<=2 ? 2 : 1);
      panel(
        '<div class="eyebrow cool">'+(opts.foot?'Tackled':'Suspect down')+'</div>'+
        '<h2>'+esc(cfg.win_title||'Caught')+'</h2>'+
        '<p class="lede">'+esc(cfg.win_text||'')+'</p>'+
        '<div class="stars">'+[1,2,3].map(function(i){return '<span class="star'+(i<=stars?' on':'')+'"></span>';}).join('')+'</div>'+
        '<p class="mono">'+hits+' collision(s)</p>'+
        '<button class="btn" id="bW">Continue</button>'
      );
      document.getElementById('bW').onclick = function(){ hidePanel(); done({ stars:stars, hits:hits }); };
    }
    function fail(){
      if(ended) return; ended=true; setTimer(null);
      panel(
        '<div class="eyebrow" style="color:var(--warn)">Squad down</div>'+
        '<h2>They lost you</h2>'+
        '<p class="lede">Checkpoint is at the top of this scene. In the live build this is the revive offer — an ad or gems for a restart on the spot.</p>'+
        '<div class="btnRow">'+
        '<button class="btn ghost" id="bAd">Watch ad (stub)</button>'+
        '<button class="btn" id="bRetry">Restart scene</button></div>'
      );
      var go = function(){ S.reviveUsed++; hidePanel(); reset(); ended=false; };
      document.getElementById('bAd').onclick = go;
      document.getElementById('bRetry').onclick = go;
    }
  };
}

/* ============================================================
   STANDOFF — slow motion, tap the right target
   ============================================================ */
TEMPLATES.standoff = function(){
  var cfg, done, d, targets=[], time=0, ended=false, t=0, holdT=0;
  return {
    enter:function(c, cb){
      cfg=c; done=cb; d=dstr(c.district); t=0; ended=false;
      time = c.time_s || 5;
      holdT = 0;
      var n = (c.targets||[]).length;
      targets = (c.targets||[]).map(function(tg,i){
        return { id:tg.id, label:tg.label, correct:!!tg.correct,
                 x: W*(0.22 + 0.56*(n===1?0.5:i/(n-1))), y: H*(0.44 + (i%2)*0.10), r: Math.min(W,H)*0.075 };
      });
      setHint('Tap the right target — fast');
    },
    resize:function(){ var n=targets.length; targets.forEach(function(tg,i){
      tg.x = W*(0.22 + 0.56*(n===1?0.5:i/(n-1))); tg.y = H*(0.44+(i%2)*0.10); tg.r=Math.min(W,H)*0.075; }); },
    update:function(dt){
      if(ended) return;
      t+=dt; time -= dt*(holdT>0?0.35:1);
      setTimer(time/(cfg.time_s||5), time<2?'var(--warn)':'var(--evi)');
      if(time<=0) resolve(null);
    },
    draw:function(){
      drawSky(d); drawSkyline(d, 0);
      ctx.fillStyle='rgba(10,16,19,.55)'; ctx.fillRect(0,0,W,H);
      /* slow-mo streaks */
      ctx.strokeStyle='rgba(120,145,155,.13)'; ctx.lineWidth=1;
      for(var i=0;i<22;i++){
        var y=(i*H/22 + (t*14)%(H/22));
        ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
      }
      targets.forEach(function(tg){
        ctx.strokeStyle = '#8098A3'; ctx.lineWidth=2;
        ctx.beginPath(); ctx.arc(tg.x,tg.y,tg.r+Math.sin(t*3)*2,0,7); ctx.stroke();
        ctx.strokeStyle='rgba(228,237,240,.5)'; ctx.lineWidth=1;
        ctx.beginPath(); ctx.moveTo(tg.x-tg.r*1.3,tg.y); ctx.lineTo(tg.x+tg.r*1.3,tg.y);
        ctx.moveTo(tg.x,tg.y-tg.r*1.3); ctx.lineTo(tg.x,tg.y+tg.r*1.3); ctx.stroke();
        ctx.font='600 12px "Barlow Condensed", sans-serif'; ctx.textAlign='center';
        ctx.fillStyle='#C3D2D8'; ctx.fillText(tg.label.toUpperCase(), tg.x, tg.y+tg.r+18);
        ctx.textAlign='left';
      });
      ctx.font='400 11px "JetBrains Mono", monospace'; ctx.fillStyle='#57686F';
      ctx.fillText('STANDOFF · '+time.toFixed(1)+'s', 14, 22);
    },
    onHold:function(down){ holdT = down?1:0; },
    onTap:function(px,py){
      if(ended) return;
      for(var i=0;i<targets.length;i++){
        var tg=targets[i], dx=px-tg.x, dy=py-tg.y;
        if(dx*dx+dy*dy < tg.r*tg.r*1.9) return resolve(tg);
      }
    },
    exit:function(){ setTimer(null); }
  };
  function resolve(tg){
    if(ended) return; ended=true; setTimer(null);
    var clean = tg && tg.correct;
    panel(
      '<div class="eyebrow'+(clean?' cool':'')+'">'+(clean?'Clean':'Messy')+'</div>'+
      '<h2>'+esc(clean ? (cfg.win_title||'Clean shot') : (cfg.lose_title||'It got messy'))+'</h2>'+
      '<p class="lede">'+esc(clean ? (cfg.win_text||'') : (cfg.lose_text||'The story goes on either way — a messy standoff costs trust, not progress.'))+'</p>'+
      '<button class="btn" id="bS">Continue</button>'
    );
    document.getElementById('bS').onclick = function(){ hidePanel(); done({ clean: !!clean }); };
  }
};

/* ============================================================
   CHOICE — 6 seconds, swipe or tap; timeout = Hesitate
   ============================================================ */
TEMPLATES.choice = function(){
  var cfg, done, time=6, ended=false, raf=0, grace=0;
  return {
    enter:function(c, cb){
      cfg=c; done=cb; time = c.timer_s || 6; ended=false;
      setHint('Swipe left or right — or let it run out');
      panel(
        '<div class="eyebrow" style="color:var(--warn)">Decision</div>'+
        '<h2>'+esc(cfg.prompt||'Choose')+'</h2>'+
        '<div id="choiceClock"><div id="choiceClockBar"></div></div>'+
        '<button class="choiceBtn" id="cL"><span class="k">Swipe left</span>'+esc(cfg.left.label)+'</button>'+
        '<button class="choiceBtn" id="cR"><span class="k">Swipe right</span>'+esc(cfg.right.label)+'</button>'+
        '<p class="small">Choices change who stands with you and how the city looks. They never change difficulty.</p>'
      );
      document.getElementById('cL').onclick = function(){ commit('left'); };
      document.getElementById('cR').onclick = function(){ commit('right'); };
      /* 1.2s to read the prompt before the clock starts moving */
      grace = 1.2;
      tick(performance.now());
    },
    draw:function(){ ctx.fillStyle='#0A1013'; ctx.fillRect(0,0,W,H); },
    onSwipe:function(dir){ if(dir==='left'||dir==='right') commit(dir); },
    exit:function(){ ended=true; cancelAnimationFrame(raf); hidePanel(); }
  };
  function tick(now){
    if(ended) return;
    var bar = document.getElementById('choiceClockBar');
    if(grace>0){ grace -= 1/60; raf = requestAnimationFrame(tick); return; }
    time -= 1/60;
    if(bar) bar.style.width = clamp(time/(cfg.timer_s||6),0,1)*100 + '%';
    if(time<=0) return commit('hesitate');
    raf = requestAnimationFrame(tick);
  }
  function commit(which){
    if(ended) return; ended=true; cancelAnimationFrame(raf);
    var branch = which==='hesitate' ? (cfg.hesitate||cfg.right) : cfg[which];
    if(which==='hesitate') S.mirror.hesitate++;
    for(var k in (branch.set||{})){
      if(k.indexOf('trust_')===0) S.trust[k.slice(6)] = clamp((S.trust[k.slice(6)]||0) + branch.set[k], 0, 3);
      else S.flags[k] = branch.set[k];
    }
    panel(
      '<div class="eyebrow">'+(which==='hesitate'?'You hesitated':'Decided')+'</div>'+
      '<h2>'+esc(branch.label)+'</h2>'+
      '<p class="lede">'+esc(branch.result||'')+'</p>'+
      '<p class="small">'+esc(branch.echo||'The squad will remember this.')+'</p>'+
      '<button class="btn" id="bC">Continue</button>'
    );
    document.getElementById('bC').onclick = function(){ hidePanel(); done({ choice:which }); };
  }
};

        '<button class="btn" id="bD" style="margin-top:16px">'+esc(cfg.cta||'Continue')+'</button>'
      );
      document.getElementById('bD').onclick = function(){ hidePanel(); done({}); };
    },

        { k:'Kemi Hart', value:function(s){ return s.flags.kemi==='ally'?'Ally':'Rival'; } },
        { k:'Driver', value:function(s){ return s.flags.informant==='flipped'?'Informant':'Booked'; } }
      ],
      cliff:'Spool leans to the glass: "Never saw the client. We got paid in maps. The Cartographer says hello, Rook."',
      cta:'End of greybox — Act II is next' }
  ]
}
];

/* ============================================================
   RUNNER — plays a case file scene by scene, with checkpoints
   ============================================================ */
var run = { grade:'solid', cut:false, starSum:0, starN:0 };

function startCase(i){
  S.caseIdx = i; S.sceneIdx = 0; S.evidence = [];
  run = { grade:'solid', cut:false, starSum:0, starN:0 };
  ovTitle.hidden = true;
  save();
  nextScene();
}

function nextScene(){
  var C = CASES[S.caseIdx];
  if(!C) return toTitle();
  if(S.sceneIdx >= C.scenes.length){
    S.unlocked = Math.max(S.unlocked, Math.min(CASES.length, S.caseIdx+2));
    save();
    return toTitle();
  }
  var sc = Object.assign({}, C.scenes[S.sceneIdx]);
  sc.district = sc.district || C.district;
  sc._grade = run.grade;
  sc._cut = run.cut;
  setHud(C.name, C.rank, sc.type.replace(/_/g,' '));
  save();

  Scene.play(sc, function(res){
    if(res.evidence){ S.evidence = S.evidence.concat(res.evidence); }
    if(res.grade){ run.grade = res.grade; }
    if(typeof res.cut === 'boolean'){ run.cut = res.cut; }
    if(res.stars){ run.starSum += res.stars; run.starN++; 
      S.stars[S.caseIdx] = Math.max(1, Math.round(run.starSum/Math.max(1,run.starN))); }
    S.sceneIdx++;
    save();
    nextScene();
  });
}

function toTitle(){
  if(Scene.cur && Scene.cur.exit) Scene.cur.exit();
  Scene.cur = null;
  hidePanel();
  setTimer(null); renderBag(0,0);
  setHud('COLD READ', 'ACT I', '');
  setHint('Tap a case to start');
  var rows = CASES.map(function(c,i){
    var locked = i >= S.unlocked;
    var st = S.stars[i]||0;
    return '<button class="caseRow" data-case="'+i+'"'+(locked?' disabled':'')+'>'+
      '<span class="num">0'+(i+1)+'</span>'+
      '<span class="nm">'+esc(c.name.replace(/^Case \d+ · /,''))+
        '<span style="display:block;font-family:var(--fx-body);font-size:12.5px;font-weight:400;color:var(--muted);letter-spacing:0">'+esc(c.blurb)+'</span></span>'+
      '<span class="meta">'+esc(c.rank)+'<br>'+esc(c.mins)+(st?'<br>'+'★'.repeat(st):'')+'</span>'+
    '</button>';
  }).join('');

  ovTitle.innerHTML = '<div class="sheet">'+
    '<div class="eyebrow">Greybox build · Act I</div>'+
    '<h1>COLD READ</h1>'+
    '<p class="tagline" style="margin:6px 0 14px">Read the evidence. Predict the run. Wreck the getaway.</p>'+
    '<p class="small" style="margin-bottom:16px">Plain shapes, no art, no audio. This build exists to answer one question: is <em>smash &rarr; read &rarr; chase</em> fun? Play all three and watch where you get bored.</p>'+
    rows+
    '<div class="tile"><h3 style="margin-bottom:8px">What to feel for</h3>'+
    '<div class="kv"><span class="k">Breach</span><span class="v">Is smashing worth doing, or just a timer?</span></div>'+
    '<div class="kv"><span class="k">Read</span><span class="v">Does 15 seconds of thinking break the pace?</span></div>'+
    '<div class="kv"><span class="k">Intercept</span><span class="v">Does a correct guess feel earned?</span></div>'+
    '<div class="kv"><span class="k">Pursuit</span><span class="v">Does ramming land? Is nitro readable?</span></div>'+
    '</div>'+
    '<div class="btnRow"><button class="btn ghost" id="bWipe">Reset progress</button>'+
    '<button class="btn" id="bPlay">'+(S.unlocked>1?'Play latest':'Start Case 1')+'</button></div>'+
    '<p class="mono" style="margin-top:14px">Keyboard: arrows to move · space to ram / act. Touch: swipe and tap.</p>'+
  '</div>';
  ovTitle.hidden = false;
  ovTitle.scrollTop = 0;

  ovTitle.querySelectorAll('[data-case]').forEach(function(b){
    b.onclick = function(){ startCase(+b.dataset.case); };
  });
  document.getElementById('bPlay').onclick = function(){ startCase(Math.min(S.unlocked-1, CASES.length-1)); };
  document.getElementById('bWipe').onclick = function(){
    S.unlocked=1; S.stars={}; S.flags={}; S.evidence=[];
    S.mirror={bridge:0,back:0,highway:0,docks:0,smashed:0,precise:0,hesitate:0,left:0,right:0};
    S.trust={dash:1,patch:1,juno:1,sol:1,wren:1,kemi:0}; S.reviveUsed=0;
    save(); toTitle();
  };
  /* idle backdrop */
  Scene.cur = {
    t:0,
    update:function(dt){ this.t+=dt; },
    draw:function(){
      var d = DISTRICT.market_mile;
      drawSky(d); drawSkyline(d, this.t*10); drawRoad(d, this.t*1.4, 3); drawSides(d, this.t*1.4);
      vignette();
    }
  };
}

/* ---------- hot-reload state carry ---------- */
try{
  if(window.claude && window.claude.hot){
    window.claude.hot.snapshot(function(){ return { S:S }; });
  }
}catch(e){}

function boot(carried){
  load();
  if(carried && carried.S){ for(var k in carried.S) S[k] = carried.S[k]; }
  resize();
  toTitle();
  requestAnimationFrame(function(n){ lastT = n; loop(n); });
}

try{
  if(window.claude && window.claude.hot && window.claude.hot.ready){
    window.claude.hot.ready(function(data){ boot(data||{}); });
  } else {
    boot((window.claude && window.claude.hot && window.claude.hot.data) || {});
  }
}catch(e){ boot({}); }

})();
</script>
