name: "Godot Web Export"
on:
  push:
    branches:
      - antigravity/breach-read
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  export-web:
    name: Web Export
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Export Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          cp -r /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/

      - name: Export Web
        run: |
          mkdir -p build/web
          cd godot
          godot --headless --export-release "Web" ../build/web/index.html
          cd ..
          
      - name: Add COOP/COEP Headers for SharedArrayBuffer
        run: |
          echo "Cross-Origin-Opener-Policy: same-origin" > build/web/_headers
          echo "Cross-Origin-Embedder-Policy: require-corp" >> build/web/_headers

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy-page:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: export-web
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
